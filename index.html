<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ГИБДД · ДПС — Ведомость инспектора</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="toast" class="toast"></div>
<section id="loginView" class="login-view"><div class="login-card"><div class="brand-logo">ГИБДД</div><h1>ГИБДД <span>· ДПС</span></h1><p>Закрытая ведомственная система</p><form id="loginForm"><label>Логин<input id="loginEmail" type="email" autocomplete="username" required placeholder="inspector@example.com"></label><label>Пароль<input id="loginPassword" type="password" autocomplete="current-password" required placeholder="••••••••"></label><button class="btn btn-primary wide"><i class="fa-solid fa-right-to-bracket"></i> Войти</button><div id="loginError" class="error"></div></form></div></section>
<div id="appView" class="hidden container"><header class="app-header"><div class="brand"><div class="brand-logo">ГИБДД</div><div><div class="brand-title">ГИБДД <span>· ДПС</span></div><div class="brand-subtitle"><i class="fa-solid fa-shield-halved"></i> Ведомственная система инспектора</div></div></div><div class="header-actions"><div id="inspectorBadge" class="user-badge"></div><button id="profileBtn" class="btn btn-secondary"><i class="fa-solid fa-user"></i> Профиль</button><button id="logoutBtn" class="btn btn-danger"><i class="fa-solid fa-right-from-bracket"></i> Выйти</button></div></header>
<div class="stats-grid"><div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-car"></i></div><div><b id="statVehicles">0</b><small>Автомобили</small></div></div><div class="stat-card blue"><div class="stat-icon"><i class="fa-solid fa-id-card"></i></div><div><b id="statDrivers">0</b><small>Водители</small></div></div><div class="stat-card red"><div class="stat-icon"><i class="fa-solid fa-file-lines"></i></div><div><b id="statProtocols">0</b><small>Протоколы</small></div></div><div class="stat-card orange"><div class="stat-icon"><i class="fa-solid fa-receipt"></i></div><div><b id="statFines">0</b><small>Штрафы</small></div></div><div class="stat-card green"><div class="stat-icon"><i class="fa-solid fa-circle-check"></i></div><div><b id="statPaid">0</b><small>Оплачено</small></div></div><div class="stat-card purple"><div class="stat-icon"><i class="fa-solid fa-user-shield"></i></div><div><b id="statInspector">—</b><small>Инспектор</small></div></div></div>
<nav class="tabs"><button class="tab active" data-tab="dashboard"><i class="fa-solid fa-table-columns"></i> Ведомость</button><button class="tab" data-tab="vehicles"><i class="fa-solid fa-car"></i> Автомобили</button><button class="tab" data-tab="drivers"><i class="fa-solid fa-id-card"></i> Водители</button><button class="tab" data-tab="protocols"><i class="fa-solid fa-file-lines"></i> Протоколы</button><button class="tab" data-tab="fines"><i class="fa-solid fa-receipt"></i> Штрафы</button></nav>
<main><section class="panel tab-panel active" data-panel="dashboard"><div class="panel-header"><div class="panel-title"><i class="fa-solid fa-list-check"></i> Рабочая ведомость</div><div class="toolbar"><div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input id="globalSearch" placeholder="Поиск по базе..."></div></div></div><div class="quick-grid"><button data-add="vehicles"><i class="fa-solid fa-car"></i><b>Автомобиль</b><span>Регистрация транспортного средства</span></button><button data-add="drivers"><i class="fa-solid fa-id-card"></i><b>Водителя</b><span>Карточка водителя</span></button><button data-add="protocols"><i class="fa-solid fa-file-circle-plus"></i><b>Протокол</b><span>Оформить нарушение</span></button><button data-add="fines"><i class="fa-solid fa-receipt"></i><b>Штраф</b><span>Создать постановление</span></button></div><div id="recentList" class="table-wrap"></div></section>
<section class="panel tab-panel" data-panel="vehicles"><div class="panel-header"><div class="panel-title"><i class="fa-solid fa-car"></i> Автомобили</div><button class="btn btn-gold" data-add="vehicles"><i class="fa-solid fa-plus"></i> Добавить автомобиль</button></div><div id="vehiclesTable" class="table-wrap"></div></section>
<section class="panel tab-panel" data-panel="drivers"><div class="panel-header"><div class="panel-title"><i class="fa-solid fa-id-card"></i> Водители</div><button class="btn btn-gold" data-add="drivers"><i class="fa-solid fa-plus"></i> Добавить водителя</button></div><div id="driversTable" class="table-wrap"></div></section>
<section class="panel tab-panel" data-panel="protocols"><div class="panel-header"><div class="panel-title"><i class="fa-solid fa-file-lines"></i> Протоколы</div><button class="btn btn-gold" data-add="protocols"><i class="fa-solid fa-plus"></i> Новый протокол</button></div><div id="protocolsTable" class="table-wrap"></div></section>
<section class="panel tab-panel" data-panel="fines"><div class="panel-header"><div class="panel-title"><i class="fa-solid fa-receipt"></i> Штрафы</div><button class="btn btn-gold" data-add="fines"><i class="fa-solid fa-plus"></i> Новый штраф</button></div><div id="finesTable" class="table-wrap"></div></section></main></div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle"></h2><button id="modalClose" class="btn-icon"><i class="fa-solid fa-xmark"></i></button></div><form id="entityForm"><div id="formFields" class="form-grid"></div><div class="modal-actions"><button type="button" id="modalCancel" class="btn btn-secondary">Отмена</button><button class="btn btn-gold"><i class="fa-solid fa-floppy-disk"></i> Сохранить</button></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script src="js/inspectors.js"></script><script src="js/app.js"></script>
</body></html>
