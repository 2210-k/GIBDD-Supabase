name: Repair GIBDD runtime
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('js/app.js')
          s=p.read_text()
          old='icon.className=type==="error"?"fa-solid fa-circle-xmark":type==="info"?"fa-solid fa-circle-info":"fa-solid fa-circle-check"'
          new='icon.setAttribute("class",type==="error"?"fa-solid fa-circle-xmark":type==="info"?"fa-solid fa-circle-info":"fa-solid fa-circle-check")'
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s)
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>','<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">')
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add js/app.js index.html
          git diff --cached --quiet || git commit -m 'Fix GIBDD toast icon and Font Awesome runtime'
          git push
